name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test-pack:
    name: Build, test, and pack (validation only)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: >-
          dotnet restore tests/Mecesoft.Result.Tests/Mecesoft.Result.Tests.csproj

      - name: Build production (Release, all target frameworks)
        run: >-
          dotnet build Mecesoft.Result/Mecesoft.Result.csproj
          -c Release
          --no-restore
          -p:GeneratePackageOnBuild=false
          -p:ContinuousIntegrationBuild=true

      - name: Build tests (Release, all target frameworks)
        run: >-
          dotnet build tests/Mecesoft.Result.Tests/Mecesoft.Result.Tests.csproj
          -c Release
          --no-restore
          -p:GeneratePackageOnBuild=false
          -p:ContinuousIntegrationBuild=true

      - name: Test .NET 8
        run: >-
          dotnet test tests/Mecesoft.Result.Tests/Mecesoft.Result.Tests.csproj
          -c Release
          -f net8.0
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

      - name: Test .NET 9
        run: >-
          dotnet test tests/Mecesoft.Result.Tests/Mecesoft.Result.Tests.csproj
          -c Release
          -f net9.0
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

      - name: Test .NET 10
        run: >-
          dotnet test tests/Mecesoft.Result.Tests/Mecesoft.Result.Tests.csproj
          -c Release
          -f net10.0
          --no-build
          --no-restore
          --logger "console;verbosity=minimal"

      - name: Pack for validation (no publish)
        run: >-
          dotnet pack Mecesoft.Result/Mecesoft.Result.csproj
          -c Release
          --no-build
          --no-restore
          -p:GeneratePackageOnBuild=false
          -p:ContinuousIntegrationBuild=true
          -o artifacts/packages

      - name: Inspect package contents and dependency groups
        run: |
          test -f artifacts/packages/Mecesoft.Result.1.1.0.nupkg
          test -f artifacts/packages/Mecesoft.Result.1.1.0.snupkg
          unzip -p artifacts/packages/Mecesoft.Result.1.1.0.nupkg Mecesoft.Result.nuspec | grep -q '<version>1.1.0</version>'
          for tfm in net8.0 net9.0 net10.0; do
            unzip -l artifacts/packages/Mecesoft.Result.1.1.0.nupkg | grep -q "lib/$tfm/Mecesoft.Result.dll"
            unzip -p artifacts/packages/Mecesoft.Result.1.1.0.nupkg Mecesoft.Result.nuspec | grep -q "targetFramework=\"$tfm\""
          done
          unzip -l artifacts/packages/Mecesoft.Result.1.1.0.nupkg
          unzip -l artifacts/packages/Mecesoft.Result.1.1.0.snupkg
          unzip -p artifacts/packages/Mecesoft.Result.1.1.0.nupkg Mecesoft.Result.nuspec
